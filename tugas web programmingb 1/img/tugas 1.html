<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Produk</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="0" width="700">
        <!-- Baris Judul -->
        <tr>
            <th colspan="3" bgcolor="#FFCC99" style="text-align: center; font-family: Arial, sans-serif;">
                <h2>DAFTAR PRODUK</h2>
            </th>
        </tr>
        
        <!-- Baris Isi -->
        <tr>
            <!-- Kolom Gambar dengan background kuning -->
            <td bgcolor="#FFFF99" align="center" width="30%" rowspan="3">
                <img src="pika.png" alt="Canon EOS M10" width="150">
            </td>
            
            <!-- Kolom Label Nama Produk dengan background hijau -->
            <td bgcolor="#00FF66" width="20%" style="font-family: Arial, sans-serif;">
                <b>Nama Produk</b>
            </td>
            
            <!-- Kolom Nilai Nama Produk dengan background pink -->
            <td bgcolor="#FF66CC" width="50%" style="font-family: Arial, sans-serif;">
                Canon EOS M10 Kit EF-M 15-45mm
            </td>
        </tr>
        
        <tr>
            <!-- Kolom Label Harga dengan background hijau -->
            <td bgcolor="#00FF66" style="font-family: Arial, sans-serif;">
                <b>Harga</b>
            </td>
            
            <!-- Kolom Nilai Harga dengan background pink -->
            <td bgcolor="#FF66CC" style="font-family: Arial, sans-serif; color: blue;">
                Rp 4,899,000
            </td>
        </tr>
        
        <tr>
            <!-- Kolom Label Fitur Produk dengan background hijau -->
            <td bgcolor="#00FF66" style="font-family: Arial, sans-serif; vertical-align: top;">
                <b>Fitur Produk</b>
            </td>
            
            <!-- Kolom Nilai Fitur Produk (List) dengan background pink -->
            <td bgcolor="#FF66CC" style="font-family: Arial, sans-serif;">
                <ul>
                    <li>Kamera mirrorless</li>
                    <li>Efektifitas Piksel : 18 MP</li>
                    <li>Tipe sensor : CMOS DIGIC 6</li>
                    <li>Layar : 3.0 Inch</li>
                    <li>Memiliki lampu flash dengan jarak jangkauan hingga 5 meter</li>
                </ul>
            </td>
        </tr>
    </table>

</body>
</html>
